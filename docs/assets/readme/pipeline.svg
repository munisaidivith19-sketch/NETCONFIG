  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .ttl{font-family:'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;font-size:13px;fill:#7f9bb5;letter-spacing:2px}

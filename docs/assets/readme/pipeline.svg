<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Push pipeline: validate, preview, approve, connect, backup, pre-check, apply, verify, save, with automatic rollback">
<defs>

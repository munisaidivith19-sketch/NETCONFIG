<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="NetConfig Studio: animated network topology with configuration packets flowing">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0d2233"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#16324a" stroke-width="1"/>
  </pattern>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .t{font-family:'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif;fill:#e6f0fa} .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
  .dash{stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-26}}
  .cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
  .fade{animation:fade 1.4s ease-out both} .d1{animation-delay:.25s} .d2{animation-delay:.5s} .d3{animation-delay:.75s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="380" rx="24" fill="url(#bg)"/>
<rect width="1200" height="380" rx="24" fill="url(#grid)" opacity=".55"/>
<rect x="1" y="1" width="1198" height="378" rx="23" fill="url(#sheen)" stroke="#1f3d57"/>
<g class="fade"><rect x="56" y="58" width="196" height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><circle cx="74" cy="73" r="5" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="86" y="78" class="t m" font-size="13" fill="#9ff3cf" style="fill:#9ff3cf">MULTI-VENDOR · NETDEVOPS</text></g>
<text x="54" y="150" class="t fade d1" font-size="58" font-weight="800" letter-spacing="-1.5">NetConfig <tspan fill="#34d399" style="fill:#34d399">Studio</tspan></text>
<text x="56" y="192" class="t fade d2" font-size="20" style="fill:#a9bdd0">Plan it in a form. Preview the exact commands.</text>
<text x="56" y="220" class="t fade d2" font-size="20" style="fill:#a9bdd0">Push with backup, verification and rollback.</text>
<g class="fade d3"><rect x="56" y="256" width="560" height="52" rx="14" fill="#04101c" stroke="#1f3d57"/>
<clipPath id="type"><rect x="78" y="262" height="40" width="0"><animate attributeName="width" values="0;0;470;470" keyTimes="0;.1;.55;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
<text x="78" y="289" class="m" font-size="17" fill="#34d399">$</text>
<g clip-path="url(#type)"><text x="98" y="289" class="m" font-size="17" fill="#d6e4f0">push  SW-A  vlans+access  →  verified ✓</text></g>
<rect class="cur" x="98" y="275" width="10" height="20" fill="#34d399" opacity=".9"><animate attributeName="x" values="98;98;502;502" keyTimes="0;.1;.55;1" dur="7s" repeatCount="indefinite"/></rect></g>
<text x="56" y="344" class="t m" font-size="13" style="fill:#5f7d98">Cisco IOS · Arista EOS · Juniper Junos · Aruba AOS-CX · MikroTik · Huawei · D-Link · TP-Link</text>
<path d="M705,190 L950,172" stroke="#34d399" stroke-width="2" fill="none" class="dash" opacity=".85"/>
<text x="772" y="208" class="m" font-size="11" fill="#34d399" transform="rotate(-4 772 208)">SSH · host key pinned</text>
<path id="l0" d="M950,62 L950,172" stroke="#2b5878" stroke-width="2.5" fill="none"/>
<path id="l1" d="M950,172 L835,292" stroke="#2b5878" stroke-width="2.5" fill="none"/>
<path id="l2" d="M950,172 L1080,292" stroke="#2b5878" stroke-width="2.5" fill="none"/>
<circle r="4.5" fill="#34d399" filter="url(#glow)"><animateMotion path="M705,190 L950,172" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#38bdf8" filter="url(#glow)"><animateMotion path="M950,172 L950,62" dur="2.8s" begin=".6s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#a78bfa" filter="url(#glow)"><animateMotion path="M950,172 L835,292" dur="2.2s" begin=".2s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#a78bfa" filter="url(#glow)"><animateMotion path="M950,172 L1080,292" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#fbbf24" filter="url(#glow)"><animateMotion path="M1080,292 L950,172" dur="3.1s" begin="1.7s" repeatCount="indefinite"/></circle>
<g><rect class="pulse" x="646.0" y="166" width="118" height="48" rx="14" fill="none" stroke="#34d399" stroke-width="1.5"/><rect x="646.0" y="166" width="118" height="48" rx="14" fill="#0a1a2b" stroke="#34d399" stroke-opacity=".8"/><rect x="646.0" y="166" width="118" height="48" rx="14" fill="url(#sheen)"/><circle cx="662.0" cy="184" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.35;1" dur="2.3s" repeatCount="indefinite"/></circle><text x="674.0" y="189" class="m" font-size="13" font-weight="700" fill="#e6f0fa">NETCONFIG</text><text x="662.0" y="205" class="m" font-size="10" fill="#7f9bb5">127.0.0.1</text></g>
<g><rect class="pulse" x="884.0" y="38" width="132" height="48" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5"/><rect x="884.0" y="38" width="132" height="48" rx="14" fill="#0a1a2b" stroke="#38bdf8" stroke-opacity=".8"/><rect x="884.0" y="38" width="132" height="48" rx="14" fill="url(#sheen)"/><circle cx="900.0" cy="56" r="4" fill="#38bdf8"><animate attributeName="opacity" values="1;.35;1" dur="2.1s" repeatCount="indefinite"/></circle><text x="912.0" y="61" class="m" font-size="13" font-weight="700" fill="#e6f0fa">R1-EDGE</text><text x="900.0" y="77" class="m" font-size="10" fill="#7f9bb5">router · cisco_ios</text></g>
<g><rect class="pulse" x="884.0" y="148" width="132" height="48" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5"/><rect x="884.0" y="148" width="132" height="48" rx="14" fill="#0a1a2b" stroke="#38bdf8" stroke-opacity=".8"/><rect x="884.0" y="148" width="132" height="48" rx="14" fill="url(#sheen)"/><circle cx="900.0" cy="166" r="4" fill="#38bdf8"><animate attributeName="opacity" values="1;.35;1" dur="2.1s" repeatCount="indefinite"/></circle><text x="912.0" y="171" class="m" font-size="13" font-weight="700" fill="#e6f0fa">CORE-L3</text><text x="900.0" y="187" class="m" font-size="10" fill="#7f9bb5">l3switch · arista_eos</text></g>
<g><rect class="pulse" x="769.0" y="268" width="132" height="48" rx="14" fill="none" stroke="#a78bfa" stroke-width="1.5"/><rect x="769.0" y="268" width="132" height="48" rx="14" fill="#0a1a2b" stroke="#a78bfa" stroke-opacity=".8"/><rect x="769.0" y="268" width="132" height="48" rx="14" fill="url(#sheen)"/><circle cx="785.0" cy="286" r="4" fill="#a78bfa"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="797.0" y="291" class="m" font-size="13" font-weight="700" fill="#e6f0fa">SW-A</text><text x="785.0" y="307" class="m" font-size="10" fill="#7f9bb5">aruba_aoscx</text></g>
<g><rect class="pulse" x="1014.0" y="268" width="132" height="48" rx="14" fill="none" stroke="#a78bfa" stroke-width="1.5"/><rect x="1014.0" y="268" width="132" height="48" rx="14" fill="#0a1a2b" stroke="#a78bfa" stroke-opacity=".8"/><rect x="1014.0" y="268" width="132" height="48" rx="14" fill="url(#sheen)"/><circle cx="1030.0" cy="286" r="4" fill="#a78bfa"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="1042.0" y="291" class="m" font-size="13" font-weight="700" fill="#e6f0fa">SW-B</text><text x="1030.0" y="307" class="m" font-size="10" fill="#7f9bb5">juniper_junos</text></g>
</svg>
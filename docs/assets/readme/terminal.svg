><text class="l13" x="28" y="339" fill="#c4b5fd">● backup       show running-config  (secrets masked)</text><text class="l14" x="28" y="360" fill="#c4b5fd">● apply        configure terminal revert timer 5</text><text class="l15" x="28" y="381" fill="#c4b5fd">● verify       show vlan brief  →  checks passed</text><text class="l16" x="28" y="402" fill="#c4b5fd">● confirm      configure confirm · write memory</text><text class="l17" x="28" y="423" fill="#34d399">✔ success    commands hash frozen · written to audit log</text><g class="l17"><rect class="cur" x="504" y="410" width="8" height="16" fill="#34d399"/></g>

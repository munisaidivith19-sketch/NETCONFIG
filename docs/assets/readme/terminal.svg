<text class="l0" x="28" y="64" fill="#e6f0fa">$ preview  SW-A  (Cisco IOSvL2 · cisco_ios · 10.0.0.2)</text><text class="l1" x="28" y="85" fill="#34d399">✔ validate   VLAN 2–4094 · names · ports match Gi1/0/N</text><text class="l2" x="28" y="106" fill="#34d399">✔ safety     denylist clean · mgmt interface protected</text><text class="l3" x="28" y="127" fill="#4f6f8c">── generated commands ─────────────────────────────</text><text class="l4" x="28" y="148" fill="#7dd3fc">vlan 10</text><text class="l5" x="28" y="169" fill="#7dd3fc"> name Sales</text><text class="l6" x="28" y="190" fill="#7dd3fc">interface GigabitEthernet1/0/1</text><text class="l7" x="28" y="211" fill="#7dd3fc"> description Sales desks</text><text class="l8" x="28" y="232" fill="#7dd3fc"> switchport mode access</text><text class="l9" x="28" y="253" fill="#7dd3fc"> switchport access vlan 10</text><text class="l10" x="28" y="274" fill="#7dd3fc"> no shutdown</text><text class="l11" x="28" y="295" fill="#4f6f8c">── push ──────────────────────────────────────────</text><text class="l12" x="28" y="316" fill="#c4b5fd">● connect      ssh · host key fingerprint matches</text><text class="l13" x="28" y="337" fill="#c4b5fd">● backup       show running-config  (secrets masked)</text><text class="l14" x="28" y="358" fill="#c4b5fd">● apply        configure terminal revert timer 5</text><text class="l15" x="28" y="379" fill="#c4b5fd">● verify       show vlan brief  →  checks passed</text><text class="l16" x="28" y="400" fill="#c4b5fd">● confirm      configure confirm · write memory</text><text class="l17" x="28" y="421" fill="#34d399">✔ success    commands hash frozen · written to audit log</text>

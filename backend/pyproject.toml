[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["B008"]  # FastAPI uses Depends() in default arguments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S107"]  # S104: "0.0.0.0" is test data, not a bind address
"scripts/**" = ["T201"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
